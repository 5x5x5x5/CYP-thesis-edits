[project]
name = "cyp"
version = "0.1.0"
description = "Cytochrome P450 inhibitor classification (M.S. thesis code)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[dependency-groups]
dev = [
    "nbconvert",
    "nbformat",
    "ipykernel",
    "ruff",
]
experiments = [
    "catboost>=1.2.10",
    "lightgbm>=4.7.0",
    "rdkit>=2026.9.2",
    "xgboost>=3.2.0",
]

[tool.uv]
package = false
